<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPA Enterprises LLC</title>
<meta name="description" content="MPA Enterprises LLC. Podcast, public speaking, consulting, payroll and benefits. Website coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Archivo:wght@500;600;700&display=swap">
<style>
  :root{
    --ground:#faf8f4; --navy:#1b2b50; --ink:#16203a; --ink-soft:#565f78;
    --gold:#a97f24; --gold-bright:#c9a24b; --ribbon-a:#e6c877; --ribbon-b:#b0872a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:"Archivo",system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:2rem 1.2rem;-webkit-font-smoothing:antialiased}
  .wordmark{position:relative;display:inline-block;padding:0 .18em}
  .wordmark .mpa{display:block;font-family:"Cormorant Garamond",serif;font-weight:700;
    font-size:clamp(5rem,22vw,12rem);line-height:.82;letter-spacing:.05em;
    color:var(--navy);position:relative;z-index:2}
  .ribbon{position:absolute;left:-6%;width:112%;top:52%;transform:translateY(-50%);
    z-index:1;pointer-events:none}
  .legal{font-family:"Cormorant Garamond",serif;font-weight:600;
    font-size:clamp(1.1rem,4.4vw,1.9rem);letter-spacing:.32em;color:var(--navy);
    margin-top:.4rem;padding-left:.32em}
  .tagline{margin-top:1.5rem;display:inline-flex;gap:.85rem;align-items:center;
    flex-wrap:wrap;justify-content:center;font-size:.76rem;letter-spacing:.24em;
    text-transform:uppercase;color:var(--gold);font-weight:700}
  .tagline .dot{width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:.7}
  .soon{margin-top:2.6rem;font-size:1.05rem;color:var(--ink-soft)}
  .place{margin-top:.6rem;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-soft);opacity:.8}
  .rule{width:44px;height:2px;background:var(--gold-bright);margin:2rem auto 0;border-radius:2px}
</style>
</head>
<body>
  <div class="wordmark">
    <svg class="ribbon" viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true">
      <path d="M8 130 C 220 58, 360 58, 520 104 C 680 150, 820 150, 992 76"
        fill="none" stroke="url(#rib)" stroke-width="15" stroke-linecap="round"/>
      <defs><linearGradient id="rib" x1="0" x2="1">
        <stop offset="0" stop-color="#b0872a"/>
        <stop offset=".5" stop-color="#e6c877"/>
        <stop offset="1" stop-color="#b0872a"/>
      </linearGradient></defs>
    </svg>
    <span class="mpa">MPA</span>
  </div>
  <div class="legal">ENTERPRISES&nbsp;LLC</div>
  <div class="tagline"><span>People</span><span class="dot"></span><span>Process</span><span class="dot"></span><span>Progress</span></div>
  <div class="rule"></div>
  <p class="soon">Our new website is on the way.</p>
  <div class="place">Albuquerque, New Mexico</div>
</body>
</html>
